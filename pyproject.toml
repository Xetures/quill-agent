[project]
name = "quill-agent"
version = "0.1.21"
description = "本地优先的 Agent 应用：提示词、工具、会话都可配可改，业务层与界面完全分离"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 附件上传走 multipart（server/routes/chat.py 里的 Form / File）。**必须显式声明**：
    # 它不是 fastapi 的强制依赖，而 starlette 在注册带 Form/File 的路由时会检查它 ——
    # 少了它，服务在启动阶段就抛 RuntimeError，连页面都打不开。
    #
    # 它原先一直是「借」别的包带进来的，所以本地一直没暴露；那个包被拆掉之后，
    # 新环境里就没有了。教训：**任何直接用到的东西都要自己声明**，
    # 借来的依赖会在某次无关的改动里突然消失。
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "openai>=3.14.1",
    "mcp>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

# 桌面壳（见 quill_agent/desktop.py）。**单独放**、不进主依赖：不做桌面版的人
# 不该为一个 WebView 绑定多装一层，命令行与浏览器版照旧 `uv sync` 就能跑
desktop = [
    "pywebview>=5.3",
]

[project.scripts]
quill = "quill_agent.cli:main"
quill-desktop = "quill_agent.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src 布局：源码放在 src/ 下，避免本地目录被意外 import
[tool.hatch.build.targets.wheel]
packages = ["src/quill_agent", "server"]

# 出厂资源**随包发布**：`bootstrap.template_dir` 最先找的就是 `quill_agent/resources/<name>`
# （另一条路是「仓库根/<name>」，那只在源码树里成立）。少了这一段，装出来的 wheel 里
# 没有出厂提示词与技能 —— 应用照样能起，但**新用户第一次打开是空的**，而且不报任何错。
[tool.hatch.build.targets.wheel.force-include]
"prompt" = "quill_agent/resources/prompt"
"skills" = "quill_agent/resources/skills"

[tool.ruff]
src = ["src", "app", "server"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
