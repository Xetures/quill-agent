<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Quill</title>

    <script>
      // 主题、字号、语言都必须在样式表生效之前落到 <html> 上，否则用户会看到一次跳动
      // （深色闪白、字号突变）。必须内联：外链模块要等下载 + 解析完才执行，那时已经晚了
      ;(function () {
        try {
          var saved = localStorage.getItem('quill:theme') || 'auto'
          var dark =
            saved === 'dark' ||
            saved === 'twilight' ||
            saved === 'ember' ||
            saved === 'aurora' ||
            (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          // 「跟随系统」时深浅各用用户选的那一套（见 stores/theme.ts）。没存过、写坏了
          // 就退回最基础的两档 —— 与 store 里那份校验一致
          var autoLight = localStorage.getItem('quill:auto-light')
          var autoDark = localStorage.getItem('quill:auto-dark')
          var theme =
            saved === 'auto'
              ? dark
                ? autoDark === 'dark' ||
                  autoDark === 'twilight' ||
                  autoDark === 'ember' ||
                  autoDark === 'aurora'
                  ? autoDark
                  : 'dark'
                : autoLight === 'light' ||
                    autoLight === 'forest' ||
                    autoLight === 'amber' ||
                    autoLight === 'sakura'
                  ? autoLight
                  : 'light'
              : saved
          document.documentElement.dataset.theme = theme

          // 字号：只认这两个值，其余（没选过、写坏了）一律标准档 —— 与 stores/font-size.ts 一致
          var size = localStorage.getItem('quill:font-size')
          document.documentElement.dataset.fontSize =
            size === 'small' || size === 'large' ? size : 'standard'

          // 语言：文案由 vue-i18n 接管（见 locales/），这里只把 lang 属性挂对 ——
          // 断词规则和读屏发音都靠它
          var locale = localStorage.getItem('quill:locale')
          if (locale) document.documentElement.lang = locale
        } catch (e) {
          // localStorage 不可用（隐私模式）时按默认走，不影响其它功能
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-DMrQ-3Az.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-ZiqpTFgx.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
